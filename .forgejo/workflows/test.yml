name: runner smoke test

on: [push]

jobs:
  format-check:
    runs-on: docker
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install formatters
        run: python3 -m pip install black isort
      - name: check formatting
        run: |
          isort --check --diff .
          black --check --diff .

