name: runner smoke test

on: [push]

jobs:
  format-check:
    runs-on: docker
    container: nikolaik/python-nodejs:python3.11-nodejs20
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install formatters
        run: pip install black isort
      - name: check formatting
        run: |
          isort --check --diff .
          black --check --diff .
