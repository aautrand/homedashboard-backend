name: ci

on:
  push:
    branches-ignore: [main]   # main only gets updates via merge from dev, no need to re-check
  pull_request:
    branches: [dev, main]     # run checks for PRs targeting either

jobs:
  format-check:
    runs-on: docker
    container: nikolaik/python-nodejs:python3.11-nodejs20
    steps:
      - uses: actions/checkout@v4
      - run: pip install black isort
      - run: |
          isort --check --diff .
          black --check --diff .

  test:
    runs-on: docker
    container: nikolaik/python-nodejs:python3.11-nodejs20
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction --no-ansi
      - name: Run tests
        run: python -m pytest tests/ -v