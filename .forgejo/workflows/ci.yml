name: runner smoke test

on: [push]

jobs:
  format-check:
    runs-on: docker
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install formatters
        run: |
          apt-get install -y python3-pip
          python3 -m pip install black isort --break-system-packages
      - name: check formatting
        run: |
          isort --check --diff .
          black --check --diff .

