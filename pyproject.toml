[project]
name = "dashboard"
version = "0.1.0"
description = ""
authors = [
    {name = "Alan Autrand",email = "contact@aautrand.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask (>=3.1.1,<4.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "black (>=25.1.0,<26.0.0)",
    "isort (>=6.0.1,<7.0.0)",
    "setuptools (==80.9.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "pika (>=1.3.2,<2.0.0)",
    "caldav (>=2.0.1,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "vobject (>=0.9.9,<0.10.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "openai (>=1.93.0,<2.0.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "alembic (>=1.16.2,<2.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "ollama (>=0.5.3,<0.6.0)",
    "minio (>=7.2.20,<8.0.0)"
]

[tool.poetry]
packages = [{include = "dashboard", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
