services:
  dashboard_be:
    build: ..
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
        POSTGRES_USER: dashboard_user
        POSTGRES_PASSWORD: dashboard_password
        POSTGRES_DB: dashboard
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: