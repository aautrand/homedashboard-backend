services:
  app:
    build: .
    ports:
      - "8050:8050"
    volumes:
      - .:/app
    # Settings and secrets come from a file outside the repo.
    env_file:
      - path: ${HOME}/.config/homedashboard/env
        required: false
    environment:
      - FLASK_ENV=development
      - FLASK_RUN_PORT=8050
      - FLASK_RUN_HOST=0.0.0.0
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
        POSTGRES_USER: dashboard_user
        POSTGRES_PASSWORD: dashboard_password
        POSTGRES_DB: dashboard
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: